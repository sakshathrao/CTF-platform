<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge 034 — Permission Check</title>
  <link rel="stylesheet" href="/main.css">
  <style>
    :root {
      color-scheme: dark;
      --bg-fallback: #090d14;
      --ink: #e5e7eb;
      --muted: #9ca3af;
      --accent-bright: #a5c4ca;
      --line: rgba(255, 255, 255, 0.16);
      --danger: #f87171;
      --success: #4ade80;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg-fallback);
      background-image: url("/assets/file_00000000bd7c81f4aafde805674aabef_upscayl_2x_upscayl-standard-4x.png");
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--ink);
      font-family: "Jost", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .vm-wrap {
      display: none;
      max-width: 1440px;
      margin: 0 auto;
      padding: 88px clamp(16px, 4vw, 48px) 52px;
    }

    .vm-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      color: var(--accent-bright);
      text-transform: uppercase;
      font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.16em;
      margin: 0;
    }

    .back-link {
      color: var(--ink);
      text-decoration: none;
      font-family: "Jost", sans-serif;
      font-size: 14px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .back-link:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: translateY(-1px);
    }

    .vm-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .vm-header h1 {
      all: unset;
      display: block;
      margin: 4px 0 10px;
      font-family: "Jost", sans-serif;
      font-size: clamp(34px, 4.5vw, 52px);
      font-weight: 400;
      letter-spacing: -1.5px;
      background: linear-gradient(181deg, #e5e7eb 30%, #9ca3af, #779399 75%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .vm-subtitle {
      max-width: 860px;
      color: var(--ink);
      font-size: 17px;
      line-height: 1.6;
      margin: 0;
    }

    .vm-badge {
      border: 1px solid var(--line);
      background: rgba(13, 21, 30, 0.78);
      backdrop-filter: blur(12px);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 999px;
      white-space: nowrap;
      font: 500 14px "Jost", sans-serif;
    }

    .case-card,
    .terminal-card,
    .submit-card {
      background: linear-gradient(180deg, rgba(13, 21, 30, 0.86) 0%, rgba(10, 16, 24, 0.92) 100%);
      backdrop-filter: blur(16px) saturate(260%) brightness(0.75);
      border: 1px solid var(--line);
      border-radius: 15px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      background: #00000030;
    }

    .case-card {
      padding: 20px 24px;
      margin-bottom: 20px;
    }

    .case-card h2,
    .submit-card h2 {
      margin: 0 0 10px;
      font-size: 19px;
      font-weight: 500;
      color: #ffffff;
    }

    .case-card p {
      color: var(--ink);
      line-height: 1.6;
      font-size: 16px;
      margin: 8px 0;
    }

    .case-card code,
    .vm-toolbar code,
    .terminal-help code,
    .hint-box code {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.92em;
    }

    .vm-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.75fr) minmax(300px, 0.85fr);
      gap: 20px;
      align-items: start;
    }

    .terminal-card {
      overflow: hidden;
    }

    .vm-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 18px;
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid var(--line);
    }

    .vm-toolbar strong {
      font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.12em;
      color: var(--accent-bright);
    }

    .vm-status {
      color: var(--muted);
      font-size: 13px;
    }

    .vm-status[data-state="ready"] {
      color: var(--success);
    }

    .vm-status[data-state="error"] {
      color: var(--danger);
    }

    #screen_container {
      min-height: 440px;
      max-height: 650px;
      overflow: auto;
      padding: 16px;
      background: rgba(2, 6, 9, 0.92);
      color: #d5e8da;
      outline: none;
      cursor: text;
    }

    #screen_container>div {
      white-space: pre;
      font: 14px/1.25 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    #screen_container canvas {
      display: none;
    }

    .terminal-help {
      padding: 12px 18px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      font-size: 13px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .submit-card {
      padding: 22px;
    }

    .submit-card p {
      color: var(--muted);
      line-height: 1.55;
      font-size: 14px;
      margin: 0 0 12px;
    }

    .submit-card label {
      display: block;
      color: var(--ink);
      font-size: 14px;
      font-weight: 500;
      margin: 16px 0 8px;
    }

    .submit-card input {
      all: unset;
      box-sizing: border-box;
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-family: "Jost", sans-serif;
      font-size: 16px;
      transition: border-color 0.2s, background 0.2s;
    }

    .submit-card input:focus {
      border-color: rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.12);
    }

    .submit-card button,
    .vm-toolbar button {
      all: unset;
      box-sizing: border-box;
      border-radius: 8px;
      background: #ffffff;
      color: #111111;
      font-family: "Jost", sans-serif;
      font-size: 15px;
      font-weight: 500;
      padding: 10px 18px;
      cursor: pointer;
      text-align: center;
      transition: transform 0.15s, background 0.15s, opacity 0.15s;
    }

    .submit-card button {
      width: 100%;
      margin-top: 12px;
    }

    .submit-card button:hover:not(:disabled),
    .vm-toolbar button:hover:not(:disabled) {
      background: #e5e7eb;
      transform: translateY(-1px);
    }

    .submit-card button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .vm-toolbar button {
      font-size: 13px;
      padding: 6px 12px;
    }

    .status-line {
      min-height: 22px;
      color: var(--danger);
      margin-top: 12px;
      font-size: 14px;
      font-weight: 500;
    }

    .status-line.ok {
      color: var(--success);
    }

    .hint-box {
      margin-top: 18px;
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }

    .hint-box h3 {
      font-size: 15px;
      font-weight: 500;
      color: #ffffff;
      margin: 0 0 8px;
    }

    .hint-box p {
      margin: 6px 0;
      font-size: 13px;
    }

    .small-note {
      color: var(--muted) !important;
      font-size: 12px !important;
    }

    #closedView {
      display: none;
      min-height: 100vh;
      align-items: center;
      padding-left: 6%;
    }

    @media (max-width: 900px) {
      .vm-layout {
        grid-template-columns: 1fr;
      }

      #screen_container {
        min-height: 350px;
      }
    }
  </style>
</head>

    </nav>
  </header>

  <main id="challengeShell" class="vm-wrap"></main>

</body>

</html>
