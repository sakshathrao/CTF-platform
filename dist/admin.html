<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTF Admin</title>
  <script type="module" crossorigin src="/assets/admin-Bxkyhasl.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-P2Xu9kJm.js">
  <link rel="stylesheet" crossorigin href="/assets/main-DuwiPGc2.css">
</head>

<body>
  <div class="main_bg" id="row">
    <h1>Admin.</h1>

    <div class="dialogBox">
      <input type="password" id="adminToken" placeholder="Admin secret token" required autocomplete="current-password">

      <select id="layout">
        <option value="wait">Wait (Lobby)</option>
        <option value="start">Start (Live Event)</option>
        <option value="end">End (Event Closed)</option>
      </select>

      <div style="width: 100%; display: flex; flex-direction: column; gap: 6px;">
        <label for="eventDuration" style="font-size: 13px; color: rgba(255, 255, 255, 0.7); text-align: left;">
          Event Duration (HH:MM:SS):
        </label>
        <input type="text" id="eventDuration" placeholder="HH:MM:SS (e.g. 01:30:00)" style="width: 100%;">
        <div id="adminTimerPreview" style="font-size: 12px; color: rgba(255, 255, 255, 0.5); text-align: left;">No timer active</div>
      </div>

      <button id="update" type="button">Update State &amp; Timer</button>

      <div id="statusMessage" style="font-size: 14px; min-height: 20px;"></div>

      <div style="display: flex; gap: 18px; margin-top: 10px;">
        <a href="main.html">Dashboard ↗</a>
        <a href="leaderboard.html">Leaderboard ↗</a>
      </div>
    </div>
  </div>

</body>

</html>
